services:
  main-service:
    build:
      context: ./services/main-service
      dockerfile: Dockerfile
    container_name: main-service-dev
    env_file: ../.env
    environment:
      - MAIN_DB_HOST=main-db
    ports:
      - "8000:8000"
    volumes:
      # Source is bind-mounted. Uvicorn runs with --reload, so any change
      # under app/ restarts the worker. Migrations run on container start.
      - ./services/main-service:/app
    depends_on:
      main-db:
        condition: service_healthy
    networks:
      - main-network-dev
    restart: unless-stopped

  main-db:
    image: postgres:15-alpine
    container_name: main-db-dev
    env_file: ../.env
    environment:
      POSTGRES_USER: ${MAIN_DB_USER}
      POSTGRES_PASSWORD: ${MAIN_DB_PASSWORD}
      POSTGRES_DB: ${MAIN_DB_NAME}
    ports:
      # Exposed on the host so psql / pgAdmin / DBeaver can attach.
      - "5432:5432"
    volumes:
      - main_db_dev_data:/var/lib/postgresql/data
    networks:
      - main-network-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  main-network-dev:
    name: main-network-dev
    external: false
  default:

volumes:
  main_db_dev_data:
